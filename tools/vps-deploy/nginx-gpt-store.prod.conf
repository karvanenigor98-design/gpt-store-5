map $host $gpt_store_host {
  default 1;
  spotify-store.ru 0;
  www.spotify-store.ru 0;
}

server {
  server_name gptplus-store.ru www.gptplus-store.ru spotify-store.ru www.spotify-store.ru;

  client_max_body_size 20m;

  location ^~ /__sb-auth/ {
    rewrite ^/__sb-auth/(.*)$ /$1 break;
    proxy_pass https://cgamktdrqkxnnmnruvvq.supabase.co;
    proxy_ssl_server_name on;
    proxy_ssl_name cgamktdrqkxnnmnruvvq.supabase.co;
    proxy_set_header Host cgamktdrqkxnnmnruvvq.supabase.co;
    proxy_ssl_verify off;
    proxy_http_version 1.1;
    proxy_connect_timeout 8s;
    proxy_read_timeout 20s;
  }

  location / {
    proxy_pass https://76.76.21.21;
    proxy_ssl_server_name on;
    proxy_ssl_name $host;
    proxy_ssl_verify off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 300s;
    proxy_buffering off;
  }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gptplus-store.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gptplus-store.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.spotify-store.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = spotify-store.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.gptplus-store.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = gptplus-store.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80 default_server;
  listen [::]:80 default_server;
  server_name gptplus-store.ru www.gptplus-store.ru spotify-store.ru www.spotify-store.ru;
    return 404; # managed by Certbot
}
