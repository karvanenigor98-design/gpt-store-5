map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

# Vercel anycast IPs that answer from NSK with SNI=gptplus-store.ru.
# 76.76.21.21 hangs from some networks — do not pin it.
upstream vercel_origin {
  least_conn;
  server 66.33.60.194:443 max_fails=1 fail_timeout=10s;
  server 64.29.17.3:443 max_fails=1 fail_timeout=10s;
  server 216.198.79.3:443 max_fails=1 fail_timeout=10s;
  keepalive 32;
  keepalive_timeout 60s;
}

upstream gotrue_origin {
  least_conn;
  server 8.6.112.0:443 max_fails=1 fail_timeout=8s;
  server 8.47.69.0:443 max_fails=1 fail_timeout=8s;
  keepalive 8;
}
