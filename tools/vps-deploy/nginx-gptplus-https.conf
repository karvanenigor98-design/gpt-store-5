server {
  server_name gptplus-store.ru www.gptplus-store.ru;
  client_max_body_size 20m;

  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;

  ssl_certificate /etc/letsencrypt/live/gptplus-store.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gptplus-store.ru/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  add_header Alt-Svc "clear" always;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location ^~ /__sb-auth/ {
    rewrite ^/__sb-auth/(.*)$ /$1 break;
    proxy_pass https://gotrue_origin;
    proxy_ssl_server_name on;
    proxy_ssl_name cgamktdrqkxnnmnruvvq.supabase.co;
    proxy_ssl_verify off;
    proxy_http_version 1.1;
    proxy_set_header Host cgamktdrqkxnnmnruvvq.supabase.co;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_next_upstream error timeout http_502 http_504;
    proxy_next_upstream_tries 2;
  }

  location = /api/auth/gpt-login {
    proxy_pass http://127.0.0.1:3099;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 2s;
    proxy_send_timeout 20s;
    proxy_read_timeout 20s;
    proxy_buffering off;
  }

  location ^~ /api/auth/ {
    proxy_pass https://vercel_origin;
    proxy_ssl_server_name on;
    proxy_ssl_name $host;
    proxy_ssl_verify off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_hide_header Alt-Svc;
    add_header Alt-Svc "clear" always;
    proxy_connect_timeout 4s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_buffering off;
  }

  location / {
    proxy_pass https://vercel_origin;
    proxy_ssl_server_name on;
    proxy_ssl_name $host;
    proxy_ssl_verify off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_hide_header Alt-Svc;
    add_header Alt-Svc "clear" always;
    proxy_socket_keepalive on;
    proxy_connect_timeout 4s;
    proxy_send_timeout 45s;
    proxy_read_timeout 45s;
    proxy_next_upstream error timeout http_502 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 12s;
    proxy_buffering off;
  }
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name gptplus-store.ru www.gptplus-store.ru;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}
